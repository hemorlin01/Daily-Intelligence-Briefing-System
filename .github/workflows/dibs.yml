name: DIBS Daily Run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read

concurrency:
  group: dibs-daily-run
  cancel-in-progress: false

jobs:
  run-dibs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Content enrichment
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # Delivery: WeCom (企业微信) — primary
      WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}

      # Delivery: Bark (optional — omit secret to skip)
      BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY || '' }}
      BARK_SERVER: ${{ secrets.BARK_SERVER || 'https://api.day.app' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY is not configured."
            exit 1
          fi
          if [ -z "$WECOM_WEBHOOK_URL" ]; then
            echo "::error::WECOM_WEBHOOK_URL is not configured."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Validate live-input config
        run: npm run dibs:validate-live-input-config

      - name: Generate live raw items
        run: npm run dibs:generate-live-inputs

      - name: Enrich with LLM (DeepSeek)
        timeout-minutes: 15
        run: npm run dibs:enrich -- --input artifacts/inputs/raw-items.json

      - name: Print live-input summary and source table
        if: always()
        run: |
          if [ -f artifacts/inputs/live_input_operational_summary.json ]; then
            npm run dibs:summarize-live-inputs
          else
            echo "No live-input summary available."
          fi

      - name: Run briefing pipeline
        run: |
          CHANNELS="wecom"
          if [ -n "$BARK_DEVICE_KEY" ]; then
            CHANNELS="$CHANNELS,bark"
          fi
          echo "Active channels: $CHANNELS"
          npm run dibs:run -- --input artifacts/inputs/raw-items.json --channels "$CHANNELS"

      - name: Print briefing outcome summary
        if: always()
        run: |
          if find artifacts/runs -name briefing_candidate_funnel.json -print -quit | grep -q .; then
            npm run dibs:summarize-briefing-run
          else
            echo "No briefing summary available."
          fi

      - name: Upload input artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dibs-input-artifacts
          path: artifacts/inputs
          if-no-files-found: warn

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dibs-run-artifacts
          path: artifacts/runs
          if-no-files-found: warn
